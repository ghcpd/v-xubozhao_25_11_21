<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fixed Demo Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 overflow-x-hidden">
  <header class="bg-white shadow">
    <nav class="container mx-auto flex items-center justify-between p-4 flex-wrap" aria-label="Main navigation">
      <div class="flex items-center space-x-6">
        <a href="#" class="text-lg font-semibold" aria-label="Home">Home</a>
        <a href="#" class="text-lg" aria-label="Reports">Reports</a>
        <a href="#" class="text-lg" aria-label="Settings">Settings</a>
      </div>
      <div class="flex items-center space-x-4">
        <button class="bg-blue-600 text-white px-4 py-2 rounded" aria-label="Open notifications">Notifications</button>
        <button class="bg-white text-blue-600 border border-blue-600 px-4 py-2 rounded" aria-label="User menu">User</button>
      </div>
    </nav>
  </header>

  <main class="container mx-auto p-6 w-full">
    <h1 class="text-3xl font-bold mb-6">Demo Dashboard</h1>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="p-6 bg-white rounded shadow">
        <h2 class="text-xl font-semibold mb-2">Summary</h2>
        <p class="text-base">Key metrics at a glance</p>
      </div>

      <div class="p-6 bg-white rounded shadow">
        <h2 class="text-xl font-semibold mb-2">Activity</h2>
        <p class="text-base">Recent user activity and logs</p>
      </div>
    </section>

    <div class="mt-6 flex flex-col sm:flex-row sm:justify-end gap-3">
      <div class="flex gap-2">
        <button class="bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded" aria-label="Cancel">Cancel</button>
        <button class="bg-blue-600 text-white px-4 py-2 rounded" aria-label="Save">Save</button>
      </div>
      <button class="bg-transparent text-blue-600 px-4 py-2 rounded" aria-label="Advanced options">Advanced</button>
    </div>

    <div class="mt-10 max-w-full">
      <p class="break-words">Some responsive content. Resize the window to see the layout adapt below 480px.</p>
    </div>

  </main>
</body>
</html>
