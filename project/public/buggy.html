<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Dashboard - Buggy</title>
  <!-- Tailwind CDN for styling (used as convenience) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* intentionally uneven spacing and fixed widths */
    .left-panel { width: 300px; }
    .content { margin-left: 320px; }

    /* Make layout break on small viewports */
    @media (max-width: 480px) {
      .left-panel { width: 380px; }
      .content { margin-left: 400px; }
    }

    /* Low contrast button */
    .low-contrast { background: #ffffff; color: #c0c0c0; border: 1px solid #ddd; }
  </style>
</head>
<body class="bg-white text-black">
  <header class="p-4 border-b">
    <h1 class="text-xl font-bold">Demo Dashboard (Buggy)</h1>
  </header>
  <main class="flex">
    <nav class="left-panel p-4 border-r">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#reports">Reports</a></li>
        <li><a href="#settings">Settings</a></li>
      </ul>
    </nav>

    <section class="content p-2">
      <div class="mb-4">
        <h2 class="text-lg">Overview</h2>
        <p class="text-sm">Some summary data here with cramped spacing</p>
      </div>

      <div class="mb-4">
        <h3>Actions</h3>
        <!-- Buttons scattered across the page (bad grouping) -->
        <div style="display:inline-block; margin-right: 20px;"><button class="border p-1">Save</button></div>
        <div style="display:inline-block; margin-left: 200px;"><button class="border p-1 low-contrast">Delete</button></div>
<br/>
        <div style="margin-top:-10px; margin-left: -5px;"> <button class="border p-1">Export</button></div>
      </div>

      <div class="cards">
        <div class="card p-2 border mb-2" style="padding:6px;margin:2px;">Card 1</div>
        <div class="card p-6 border mb-2" style="padding:20px;margin:8px;">Card 2 with inconsistent padding</div>
      </div>

      <!-- Accessibility: No labels on controls, missing aria, keyboard trap by focusing off-screen -->
      <form class="mt-6">
        <label>Username</label>
        <input id="username" name="username" placeholder="username" />
        <button id="submit" style="position:absolute; left:-10000px;">Hidden Continue</button>
      </form>
    </section>
  </main>

  <footer class="p-4 border-t">Footer content</footer>

</body>
</html>
