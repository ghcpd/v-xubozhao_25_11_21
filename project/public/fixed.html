<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Dashboard - Fixed</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <header class="bg-white shadow p-4">
    <div class="container mx-auto flex items-center justify-between">
      <h1 class="text-xl font-semibold">Demo Dashboard</h1>
      <nav aria-label="primary navigation">
        <ul class="flex gap-4">
          <li><a class="text-sm text-gray-700 hover:text-gray-900" href="#home" aria-label="Home">Home</a></li>
          <li><a class="text-sm text-gray-700 hover:text-gray-900" href="#reports" aria-label="Reports">Reports</a></li>
          <li><a class="text-sm text-gray-700 hover:text-gray-900" href="#settings" aria-label="Settings">Settings</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-4 gap-4">
    <aside class="md:col-span-1 bg-white p-4 rounded shadow" aria-label="sidebar navigation">
      <ul class="space-y-2">
        <li><a class="block text-sm text-gray-700 hover:text-gray-900" href="#home" aria-label="Home">Home</a></li>
        <li><a class="block text-sm text-gray-700 hover:text-gray-900" href="#reports" aria-label="Reports">Reports</a></li>
        <li><a class="block text-sm text-gray-700 hover:text-gray-900" href="#settings" aria-label="Settings">Settings</a></li>
      </ul>
    </aside>

    <section class="md:col-span-3">
      <div class="bg-white p-4 rounded shadow mb-4">
        <h2 class="text-lg font-medium">Overview</h2>
        <p class="text-sm text-gray-600">Summary data with consistent spacing and proper hierarchy.</p>
      </div>

      <div class="bg-white p-4 rounded shadow mb-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-md font-medium">Actions</h3>
          <div class="flex gap-2">
            <!-- Grouped action buttons (logical) -->
            <button class="px-3 py-1 text-white bg-blue-600 hover:bg-blue-700 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Save">Save</button>
            <button class="px-3 py-1 text-white bg-red-600 hover:bg-red-700 rounded focus:outline-none focus:ring-2 focus:ring-red-500" aria-label="Delete">Delete</button>
            <button class="px-3 py-1 text-gray-700 bg-gray-200 hover:bg-gray-300 rounded focus:outline-none" aria-label="Export">Export</button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="p-4 border rounded">Card 1</div>
          <div class="p-4 border rounded">Card 2</div>
        </div>
      </div>

      <form class="bg-white p-4 rounded shadow">
        <div class="mb-3">
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input id="username" name="username" placeholder="username" class="mt-1 p-2 block w-full border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700" aria-label="Continue">Continue</button>
      </form>
    </section>
  </main>

  <footer class="bg-white p-4 mt-6 text-center text-sm text-gray-500">Footer content</footer>
</body>
</html>
