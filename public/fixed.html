<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Dashboard - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-slate-900 overflow-x-hidden">
    <div class="max-w-4xl mx-auto px-4 box-border">
      <header class="flex items-center justify-between py-4">
        <div class="flex items-center gap-3">
          <img src="https://via.placeholder.com/40" alt="Acme logo" class="rounded" />
          <div>
            <h1 class="text-2xl font-semibold">Acme Dashboard</h1>
            <p class="text-sm text-slate-500">Overview and recent activity</p>
          </div>
        </div>

        <nav aria-label="Primary Navigation">
          <ul class="flex gap-4">
            <li><a class="text-sm text-slate-700 hover:text-slate-900" href="#home">Home</a></li>
            <li><a class="text-sm text-slate-700 hover:text-slate-900" href="#reports">Reports</a></li>
            <li><a class="text-sm text-slate-700 hover:text-slate-900" href="#settings">Settings</a></li>
          </ul>
        </nav>
      </header>

      <main class="bg-white rounded-lg p-6 shadow">
        <div class="flex flex-col sm:flex-row sm:justify-between gap-4">
          <div class="flex-1">
            <label for="search" class="sr-only">Search reports</label>
            <input id="search" type="search" placeholder="Search reports..." class="w-full rounded border p-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300" />
          </div>

          <div class="flex items-center gap-3 flex-wrap">
            <div class="hidden sm:block text-sm text-slate-600">Last updated: Today</div>
            <!-- Buttons grouped logically -->
            <div role="group" aria-label="Primary actions" class="flex gap-2">
              <button class="px-4 py-2 rounded-md bg-slate-900 text-white hover:bg-slate-800 focus:ring-2 focus:ring-slate-300">Save</button>
              <button class="px-4 py-2 rounded-md border border-slate-200 text-slate-700 hover:bg-slate-50">Edit</button>
              <button class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700">Delete</button>
            </div>
          </div>
        </div>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">
          <div class="p-4 border rounded">
            <h2 class="text-base font-medium">Overview</h2>
            <p class="text-sm text-slate-600 mt-2">Important metrics with clear contrast and spacing.</p>
          </div>

          <div class="p-4 border rounded">
            <h2 class="text-base font-medium">Activity</h2>
            <p class="text-sm text-slate-600 mt-2">Recent events and activity stream with accessible structure.</p>
          </div>
        </section>

        <section class="mt-6">
          <label for="notes-fixed" class="block text-sm font-medium text-slate-700">Notes</label>
          <textarea id="notes-fixed" class="mt-2 w-full rounded border p-3 h-28 focus:outline-none focus:ring-2 focus:ring-slate-300" placeholder="Add helpful notes..." aria-describedby="notes-help"></textarea>
          <p id="notes-help" class="text-xs text-slate-500 mt-1">Press Tab to move focus; there are no keyboard traps.</p>
        </section>
      </main>
    </div>

    <script>
      // Fixed page intentionally avoids keyboard traps
      document.querySelectorAll('textarea, input, button').forEach(el => el.addEventListener('keydown', e => {
        /* no-op */
      }));
    </script>
  </body>
</html>
